workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - test
  - build
  - package
  - deploy

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GIT_DEPTH: "0"
  KIOSK_VERSION: "0.2.0-$CI_PIPELINE_IID"

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  retry:
    max: 1
    when:
      - runner_system_failure

.node_job:
  image: node:22-bookworm-slim
  before_script:
    - npm ci --prefer-offline

typecheck:
  extends: .node_job
  stage: validate
  script:
    - npm run check

dependency_audit:
  extends: .node_job
  stage: validate
  script:
    - npm audit --audit-level=moderate

secret_scan:
  image:
    name: zricethezav/gitleaks:v8.29.1
    entrypoint: [""]
  stage: validate
  cache: []
  script:
    - gitleaks git . --redact=100 --verbose

server_tests:
  extends: .node_job
  stage: test
  script:
    - npm test | tee test-output.tap
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - test-output.tap

browser_tests:
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  stage: test
  before_script:
    - npm ci --prefer-offline
  script:
    - npm run test:e2e
  artifacts:
    when: on_failure
    expire_in: 14 days
    paths:
      - playwright-report/
      - test-results/

quality_report:
  extends: .node_job
  stage: build
  needs:
    - job: server_tests
      artifacts: true
    - job: browser_tests
  script:
    - BROWSER_TESTS_PASSED=4 node scripts/write-quality-report.mjs test-output.tap
  artifacts:
    expire_in: 30 days
    paths:
      - quality-report.json

build_kiosk:
  extends: .node_job
  stage: build
  needs:
    - typecheck
    - server_tests
    - browser_tests
  script:
    - VITE_BUILD_VERSION="$KIOSK_VERSION" npm run build
  artifacts:
    expire_in: 14 days
    paths:
      - dist/

build_waiter:
  extends: .node_job
  stage: build
  needs:
    - typecheck
    - server_tests
  script:
    - VITE_BUILD_VERSION="$KIOSK_VERSION" npm run build:waiter
  artifacts:
    expire_in: 14 days
    paths:
      - dist-waiter/

build_android_apks:
  image: ghcr.io/cirruslabs/android-sdk:35
  stage: package
  needs:
    - typecheck
    - server_tests
    - browser_tests
  cache:
    key: android-$CI_COMMIT_REF_SLUG
    paths:
      - .npm/
      - .gradle/caches/
      - .gradle/wrapper/
      - .ci-tools/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl xz-utils
    - mkdir -p "$CI_PROJECT_DIR/.ci-node"
    - curl --fail --silent --show-error --location "https://nodejs.org/dist/v22.23.1/node-v22.23.1-linux-x64.tar.xz" --output /tmp/node.tar.xz
    - tar -xJf /tmp/node.tar.xz -C "$CI_PROJECT_DIR/.ci-node" --strip-components=1
    - export PATH="$CI_PROJECT_DIR/.ci-node/bin:$PATH"
    - node --version
    - npm ci --prefer-offline
    - mkdir -p "$CI_PROJECT_DIR/.ci-tools"
    - test ! -s /opt/bb-ci-tools/gradle-8.14.3-bin.zip || cp /opt/bb-ci-tools/gradle-8.14.3-bin.zip "$CI_PROJECT_DIR/.ci-tools/gradle-8.14.3-bin.zip"
    - test -s "$CI_PROJECT_DIR/.ci-tools/gradle-8.14.3-bin.zip" || curl --ipv4 --fail --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 900 --continue-at - "https://services.gradle.org/distributions/gradle-8.14.3-bin.zip" --output "$CI_PROJECT_DIR/.ci-tools/gradle-8.14.3-bin.zip"
  script:
    - export PATH="$CI_PROJECT_DIR/.ci-node/bin:$PATH"
    - export CI_GRADLE_DISTRIBUTION_FILE="$CI_PROJECT_DIR/.ci-tools/gradle-8.14.3-bin.zip"
    - bash scripts/ci-build-android.sh
  artifacts:
    expire_in: 30 days
    paths:
      - artifacts/android/*.apk

build_iiko_front_plugin:
  image: mcr.microsoft.com/dotnet/sdk:8.0-bookworm-slim
  stage: package
  allow_failure: true
  tags:
    - bb-production
  variables:
    GIT_DEPTH: "1"
  before_script:
    - dotnet --info
    - apt-get update && apt-get install -y --no-install-recommends zip
  script:
    - module_id="${IIKO_LICENSE_MODULE_ID:-0}"
    - test "$module_id" -ge 0 2>/dev/null
    - dotnet build integrations/iiko-front-bridge/BrooklynBowl.IikoFrontBridge/BrooklynBowl.IikoFrontBridge.csproj -c Release -p:IikoLicenseModuleId="$module_id"
    - source_dir="integrations/iiko-front-bridge/BrooklynBowl.IikoFrontBridge/bin/Release/net472"
    - package_dir="artifacts/BB-Kiosk-IikoFrontBridge"
    - mkdir -p "$package_dir"
    - cp "$source_dir/BrooklynBowl.IikoFrontBridge.dll" "$source_dir/Newtonsoft.Json.dll" "$source_dir/Manifest.xml" "$package_dir/"
    - cp integrations/iiko-front-bridge/BridgeConfig.example.json "$package_dir/BridgeConfig.json"
    - (cd artifacts && zip -qr "BB-Kiosk-IikoFrontBridge-${module_id}.zip" BB-Kiosk-IikoFrontBridge)
  artifacts:
    expire_in: 30 days
    paths:
      - artifacts/BB-Kiosk-IikoFrontBridge/
      - artifacts/BB-Kiosk-IikoFrontBridge-*.zip
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - integrations/iiko-front-bridge/**/*
        - .gitlab-ci.yml
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - integrations/iiko-front-bridge/**/*
        - .gitlab-ci.yml
      when: manual
    - when: manual

package_kiosk_ota:
  image: ghcr.io/cirruslabs/android-sdk:35
  stage: package
  needs:
    - job: build_kiosk
      artifacts: true
  script:
    - (cd dist && zip -qr "../BB-Kiosk-$KIOSK_VERSION.zip" .)
    - printf '{"version":"%s","url":"%s/ota/BB-Kiosk-%s.zip","publishedAt":"%s"}\n' "$KIOSK_VERSION" "$PUBLIC_APP_URL" "$KIOSK_VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ota-manifest.json
  artifacts:
    expire_in: 30 days
    paths:
      - BB-Kiosk-*.zip
      - ota-manifest.json

package_waiter_ota:
  image: ghcr.io/cirruslabs/android-sdk:35
  stage: package
  needs:
    - job: build_waiter
      artifacts: true
  script:
    - (cd dist-waiter && zip -qr "../BB-Waiter-$KIOSK_VERSION.zip" .)
    - printf '{"version":"%s","url":"%s/ota/waiter/BB-Waiter-%s.zip","publishedAt":"%s"}\n' "$KIOSK_VERSION" "$PUBLIC_APP_URL" "$KIOSK_VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > waiter-ota-manifest.json
  artifacts:
    expire_in: 30 days
    paths:
      - BB-Waiter-*.zip
      - waiter-ota-manifest.json

deploy_production:
  image: ghcr.io/cirruslabs/android-sdk:35
  stage: deploy
  allow_failure: true
  interruptible: false
  resource_group: production
  environment:
    name: production
    url: $PUBLIC_APP_URL
  needs:
    - job: build_kiosk
      artifacts: true
    - job: package_kiosk_ota
      artifacts: true
    - job: package_waiter_ota
      artifacts: true
    - job: quality_report
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends rsync
    - test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_WEB_ROOT" && test -n "$DEPLOY_API_ROOT"
    - test -f "$DEPLOY_SSH_PRIVATE_KEY" && test -f "$SSH_KNOWN_HOSTS"
    - install -m 700 -d ~/.ssh
    - install -m 600 "$DEPLOY_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - install -m 600 "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_WEB_ROOT/ota/waiter' '$DEPLOY_WEB_ROOT/uploads/banners' '$DEPLOY_WEB_ROOT/uploads/products' '$DEPLOY_API_ROOT/ops' '$DEPLOY_API_ROOT/server'"
    - rsync -az --delete --exclude='ota/' --exclude='uploads/' dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_WEB_ROOT/"
    - scp BB-Kiosk-*.zip "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_WEB_ROOT/ota/"
    - scp ota-manifest.json "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_WEB_ROOT/ota/manifest.json"
    - scp BB-Waiter-*.zip "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_WEB_ROOT/ota/waiter/"
    - scp waiter-ota-manifest.json "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_WEB_ROOT/ota/waiter/manifest.json"
    - scp server/index.mjs server/migrate.mjs server/core.mjs server/iiko-front-bridge.mjs menu.json package.json package-lock.json quality-report.json "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_API_ROOT/"
    - scp server/bb-kiosk-api.service "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_API_ROOT/server/"
    - scp ops/* "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_API_ROOT/ops/"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash '$DEPLOY_API_ROOT/ops/deploy-api.sh'"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
