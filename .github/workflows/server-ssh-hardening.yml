name: Harden production SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Configure deploy key
        env:
          DEPLOY_KEY: ${{ secrets.ZAKAZ_OTA_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H 201.24.51.231 >> ~/.ssh/known_hosts
      - name: Install and validate SSH hardening
        run: |
          scp -o ConnectTimeout=20 ops/harden-ssh.sh ops/sshd-brooklynbowl.conf ops/fail2ban-sshd.local root@201.24.51.231:/tmp/
          ssh -o ConnectTimeout=20 root@201.24.51.231 'chmod 700 /tmp/harden-ssh.sh && /tmp/harden-ssh.sh'
      - name: Verify a fresh key-only connection
        run: |
          ssh -o ConnectTimeout=20 -o PreferredAuthentications=publickey -o PasswordAuthentication=no root@201.24.51.231 'printf "SSH key connection verified\n"'
