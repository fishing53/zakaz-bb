name: Publish kiosk OTA update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build the kiosk web bundle
        run: |
          npm ci
          npm run build
      - name: Package OTA bundle
        id: bundle
        run: |
          version="${GITHUB_SHA::12}"
          (cd dist && zip -qr "../zakaz-bb-${version}.zip" .)
          printf '{"version":"%s","url":"https://xn--80aatcn.xn--b1ajk7f.xn--p1ai/ota/zakaz-bb-%s.zip"}\n' "$version" "$version" > ota-manifest.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish bundle to the kiosk update server
        env:
          DEPLOY_KEY: ${{ secrets.ZAKAZ_OTA_DEPLOY_KEY }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 194.226.142.35 >> ~/.ssh/known_hosts
          ssh root@194.226.142.35 'mkdir -p /var/www/zakaz-zvyak/ota /var/www/zakaz-zvyak/uploads/banners /var/www/zakaz-zvyak/uploads/products && chown -R www-data:www-data /var/www/zakaz-zvyak/uploads'
          rsync -az --delete --exclude='ota/' --exclude='uploads/' dist/ root@194.226.142.35:/var/www/zakaz-zvyak/
          scp "zakaz-bb-${VERSION}.zip" root@194.226.142.35:"/var/www/zakaz-zvyak/ota/zakaz-bb-${VERSION}.zip"
          scp ota-manifest.json root@194.226.142.35:/var/www/zakaz-zvyak/ota/manifest.json
          ssh root@194.226.142.35 'chown -R www-data:www-data /var/www/zakaz-zvyak/ota /var/www/zakaz-zvyak/uploads'
      - name: Deploy API and database migrations
        run: |
          scp server/index.mjs server/migrate.mjs root@194.226.142.35:/opt/zakaz-api/
          ssh root@194.226.142.35 'mkdir -p /opt/zakaz-api/ops'
          scp ops/* root@194.226.142.35:/opt/zakaz-api/ops/
          ssh root@194.226.142.35 'set -a; . /etc/zakaz-api.env; set +a; cd /opt/zakaz-api && node --check index.mjs && node migrate.mjs && chmod 755 ops/*.sh && cp ops/zakaz-*.service ops/zakaz-*.timer /etc/systemd/system/ && systemctl daemon-reload && systemctl enable --now zakaz-backup.timer zakaz-health.timer && systemctl restart zakaz-api && systemctl is-active zakaz-api && curl --fail --silent --show-error --retry 8 --retry-delay 2 http://127.0.0.1:3107/api/v1/health/ready >/dev/null'
