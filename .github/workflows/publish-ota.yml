name: Publish kiosk OTA update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run critical server and integration tests
        run: |
          set -o pipefail
          npm test | tee test-output.tap
      - name: Run browser end-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Record successful quality gate
        env:
          BROWSER_TESTS_PASSED: 4
        run: node scripts/write-quality-report.mjs test-output.tap
      - name: Build the kiosk web bundle
        env:
          VITE_BUILD_VERSION: 0.1.0-${{ github.run_number }}
        run: npm run build
      - name: Package OTA bundle
        id: bundle
        run: |
          version="0.1.0-${GITHUB_RUN_NUMBER}"
          (cd dist && zip -qr "../BB-Kiosk-${version}.zip" .)
          printf '{"version":"%s","url":"https://order.brooklynbowl.ru/ota/BB-Kiosk-%s.zip","publishedAt":"%s"}\n' "$version" "$version" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ota-manifest.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish bundle to the kiosk update server
        env:
          DEPLOY_KEY: ${{ secrets.ZAKAZ_OTA_DEPLOY_KEY }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 201.24.51.231 >> ~/.ssh/known_hosts
          ssh root@201.24.51.231 'mkdir -p /var/www/bb-kiosk/ota /var/www/bb-kiosk/uploads/banners /var/www/bb-kiosk/uploads/products && chown -R www-data:www-data /var/www/bb-kiosk/uploads'
          rsync -az --delete --exclude='ota/' --exclude='uploads/' dist/ root@201.24.51.231:/var/www/bb-kiosk/
          scp "BB-Kiosk-${VERSION}.zip" root@201.24.51.231:"/var/www/bb-kiosk/ota/BB-Kiosk-${VERSION}.zip"
          scp ota-manifest.json root@201.24.51.231:/var/www/bb-kiosk/ota/manifest.json
          ssh root@201.24.51.231 'chown -R www-data:www-data /var/www/bb-kiosk/ota /var/www/bb-kiosk/uploads && find /var/www/bb-kiosk/ota -maxdepth 1 -type f -name "BB-Kiosk-*.zip" -printf "%T@ %p\0" | sort -zrn | tail -zn +11 | cut -zd" " -f2- | xargs -0r rm --'
      - name: Deploy API and database migrations
        run: |
          scp server/index.mjs server/migrate.mjs server/core.mjs server/iiko-front-bridge.mjs menu.json package.json package-lock.json quality-report.json root@201.24.51.231:/opt/bb-kiosk-api/
          ssh root@201.24.51.231 'mkdir -p /opt/bb-kiosk-api/ops /opt/bb-kiosk-api/server'
          scp ops/* root@201.24.51.231:/opt/bb-kiosk-api/ops/
          scp server/bb-kiosk-api.service root@201.24.51.231:/opt/bb-kiosk-api/server/
          ssh root@201.24.51.231 'bash /opt/bb-kiosk-api/ops/deploy-api.sh'
