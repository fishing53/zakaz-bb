name: Publish kiosk OTA update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-web-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run critical server and integration tests
        run: |
          set -o pipefail
          npm test | tee test-output.tap
      - name: Run browser end-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Record successful quality gate
        env:
          BROWSER_TESTS_PASSED: 4
        run: node scripts/write-quality-report.mjs test-output.tap
      - name: Build the kiosk web bundle
        env:
          VITE_BUILD_VERSION: 0.1.0-${{ github.run_number }}
        run: npm run build
      - name: Package OTA bundle
        id: bundle
        run: |
          version="0.1.0-${GITHUB_RUN_NUMBER}"
          (cd dist && zip -qr "../zakaz-bb-${version}.zip" .)
          printf '{"version":"%s","url":"https://xn--80aatcn.xn--b1ajk7f.xn--p1ai/ota/zakaz-bb-%s.zip","publishedAt":"%s"}\n' "$version" "$version" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ota-manifest.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish bundle to the kiosk update server
        env:
          DEPLOY_KEY: ${{ secrets.ZAKAZ_OTA_DEPLOY_KEY }}
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 194.226.142.35 >> ~/.ssh/known_hosts
          ssh root@194.226.142.35 'mkdir -p /var/www/zakaz-zvyak/ota /var/www/zakaz-zvyak/uploads/banners /var/www/zakaz-zvyak/uploads/products && chown -R www-data:www-data /var/www/zakaz-zvyak/uploads'
          rsync -az --delete --exclude='ota/' --exclude='uploads/' dist/ root@194.226.142.35:/var/www/zakaz-zvyak/
          scp "zakaz-bb-${VERSION}.zip" root@194.226.142.35:"/var/www/zakaz-zvyak/ota/zakaz-bb-${VERSION}.zip"
          scp ota-manifest.json root@194.226.142.35:/var/www/zakaz-zvyak/ota/manifest.json
          ssh root@194.226.142.35 'chown -R www-data:www-data /var/www/zakaz-zvyak/ota /var/www/zakaz-zvyak/uploads'
      - name: Deploy API and database migrations
        run: |
          scp server/index.mjs server/migrate.mjs server/core.mjs quality-report.json root@194.226.142.35:/opt/zakaz-api/
          ssh root@194.226.142.35 'mkdir -p /opt/zakaz-api/ops'
          scp ops/* root@194.226.142.35:/opt/zakaz-api/ops/
          ssh root@194.226.142.35 'bash /opt/zakaz-api/ops/deploy-api.sh'
