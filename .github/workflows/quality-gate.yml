name: Quality gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:critical
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
