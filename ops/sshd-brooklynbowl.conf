# BrooklynBowl production SSH hardening.
# This file is installed as 00-brooklynbowl-hardening.conf so these values are
# evaluated before cloud-init's password-authentication defaults.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
LoginGraceTime 20
MaxAuthTries 3
MaxStartups 30:30:100
PerSourceMaxStartups 3

